apiVersion: v1
kind: ServiceAccount
metadata:
  name: atomix-controller
  namespace: micro-onos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atomix-controller
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atomix-controller
subjects:
  - kind: ServiceAccount
    name: atomix-controller
    namespace: micro-onos
roleRef:
  kind: ClusterRole
  name: atomix-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atomix-controller
  namespace: micro-onos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atomix-controller
  template:
    metadata:
      labels:
        app: atomix-controller
    spec:
      serviceAccountName: atomix-controller
      containers:
        - name: controller
          image: docker.io/atomix/controller:latest
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atomix-memory-node
  namespace: micro-onos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atomix-memory-node
  template:
    metadata:
      labels:
        app: atomix-memory-node
    spec:
      containers:
        - name: node
          image: docker.io/atomix/memory-storage-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: atomix-memory-node
  namespace: micro-onos
spec:
  selector:
    app: atomix-memory-node
  ports:
    - port: 5678
      targetPort: 5678
