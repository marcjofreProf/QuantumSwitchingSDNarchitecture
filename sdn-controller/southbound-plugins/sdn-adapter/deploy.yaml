---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdn-adapter
  namespace: micro-onos
  labels:
    app: sdn-adapter
    app.kubernetes.io/name: sdn-adapter
    app.kubernetes.io/part-of: quantum-sdn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdn-adapter
  template:
    metadata:
      labels:
        app: sdn-adapter
        app.kubernetes.io/name: sdn-adapter
        app.kubernetes.io/part-of: quantum-sdn
    spec:
      containers:
        - name: sdn-adapter
          image: sdn-adapter:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ADAPTER_PORT
              value: "8080"
            - name: ADAPTER_BIND
              value: "0.0.0.0"
            - name: NETCONF_TIMEOUT
              value: "10"
            - name: GNOI_TIMEOUT
              value: "15"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: sdn-adapter
  namespace: micro-onos
  labels:
    app: sdn-adapter
    app.kubernetes.io/name: sdn-adapter
    app.kubernetes.io/part-of: quantum-sdn
spec:
  type: ClusterIP
  selector:
    app: sdn-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
